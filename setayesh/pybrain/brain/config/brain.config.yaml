# پیکربندی پیش‌فرض مغز سرور (مرجع).
# نکته: تنظیمات زندهٔ کاربر در vault/config/brain-settings.md است که هر گام
# بدون ری‌استارت خوانده می‌شود. این فایل فقط برای مستندسازی مقادیر پیش‌فرض است.
model: qwen2.5:7b       # مدل محلی روی Ollama
temperature: 0.4        # خلاقیت پاسخ (0 تا 1)
max_steps: 6            # سقف گام حلقهٔ عامل
ollama_host: http://localhost:11434
webhook_port: 8787
