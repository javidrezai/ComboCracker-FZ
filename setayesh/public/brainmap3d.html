<!doctype html>
<!-- SETAYESH_BUILD 9.9.186 -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setayesh — مغز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{--bg:#05070d;--b:#3aa8ff;--g:#ffab3d;--v:#a878ff;--t:#eaf1fb;--m:#7f93b3;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--t);font-family:Vazirmatn,Tahoma,sans-serif}
body{background:radial-gradient(120% 90% at 50% 46%,#0a1428 0%,#060a14 48%,#04060c 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;line-height:1;display:inline-block;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:'liga'}
/* Labels: small, tidy, professional — a thin glass chip, not a big childish pill. */
.labels{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font:inherit;color:#eaf1fb;white-space:nowrap;
 display:flex;align-items:center;gap:6px;will-change:transform,opacity;font-size:clamp(10px,.92vw,12.5px);font-weight:500;letter-spacing:.1px;
 padding:3px 10px 3px 3px;border-radius:100px;background:rgba(9,15,28,.46);backdrop-filter:blur(8px);
 border:1px solid #ffffff1a;box-shadow:0 2px 12px #0005;transition:opacity .35s ease,border-color .25s,background .25s}
.node .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.node .ic .ms{font-size:14px}
.node .sub{font-size:9px;color:#8fa3c4;font-weight:400;margin-inline-start:1px}
.node.b .ic{background:linear-gradient(140deg,#2a6bff,#39c0ff);box-shadow:0 0 10px #2a9dff77}
.node.g .ic{background:linear-gradient(140deg,#ff7a00,#ffc24d);box-shadow:0 0 10px #ffab3d77;color:#241000}
.node.io .ic{background:linear-gradient(140deg,#8a5cff,#c56bff);box-shadow:0 0 10px #a06bff88}
.node:hover,.node:focus-visible{outline:none;border-color:#ffffff66;background:rgba(14,24,44,.72);z-index:9}
.node:hover .ic,.node:focus-visible .ic{filter:brightness(1.15)}
/* The Agent core — the glowing centre. */
.core{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);
 width:clamp(96px,11vw,140px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:radial-gradient(circle at 50% 42%,#f2f9ff 0,#9ad6ff 26%,#2f7dff 58%,#0a2f7a 100%);
 border:none;box-shadow:0 0 0 1px #bfe4ff77,0 0 28px 6px #38b4ff55,0 0 66px 20px #2a7aff2e,inset 0 -8px 20px #0a2f7a99;
 font-family:inherit;color:#04122e;font-weight:700}
.core b{display:block;font-size:clamp(13px,1.5vw,17px);letter-spacing:.2px}
.core span{display:block;font-size:clamp(8px,.95vw,11px);font-weight:500;opacity:.82;margin-top:1px;letter-spacing:.4px}
.tip{position:fixed;z-index:20;max-width:min(280px,86vw);padding:13px 15px;border-radius:16px;
 background:rgba(9,15,28,.88);backdrop-filter:blur(16px);border:1px solid #ffffff1c;box-shadow:0 20px 50px #000a;
 opacity:0;transform:translateY(6px) scale(.98);transition:.22s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tip.on{opacity:1;transform:none}
.tip .h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tip .h .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.tip strong{font-size:14px;direction:ltr;font-weight:700}
.tip p{margin:0;font-size:12.5px;line-height:1.8;color:#c4d4ec}
.brand{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
 font-size:10px;letter-spacing:3px;color:#3a4a66;text-transform:uppercase;pointer-events:none;font-weight:500;opacity:.5}
.hint{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;
 font-size:11.5px;color:#5a6f92;pointer-events:none;transition:opacity 1s ease}
.hint.gone{opacity:0}
.close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:15;height:38px;padding:0 15px;border-radius:19px;
 background:rgba(10,18,34,.6);backdrop-filter:blur(10px);border:1px solid #ffffff1f;color:#cfe0ff;cursor:pointer;
 display:flex;align-items:center;gap:6px;font:inherit;font-size:13px}
.zoom{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:15;display:flex;gap:8px}
.zoom button{width:38px;height:38px;border-radius:12px;background:rgba(10,18,34,.6);backdrop-filter:blur(10px);
 border:1px solid #ffffff1f;color:#cfe0ff;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.node,.tip{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="مغز سه‌بعدی ستایش"></canvas>
<div class="labels" id="labels"></div>
<div class="tip" id="tip" role="dialog" aria-live="polite"></div>
<button class="close" id="closeBtn" type="button">✕ بستن</button>
<div class="zoom">
  <button id="zoomIn" type="button" title="بزرگ‌نمایی" aria-label="بزرگ‌نمایی">+</button>
  <button id="zoomOut" type="button" title="کوچک‌نمایی" aria-label="کوچک‌نمایی">−</button>
</div>
<div class="hint" id="hint">بچرخان · با دو انگشت یا اسکرول یا کلیدهای بالا/پایین زوم کن · روی هر بخش بزن</div>
<div class="brand">SETAYESH</div>
<script>
// Close button bound via addEventListener (never an inline onclick= attribute,
// which the app's CSP script-src-attr 'none' blocks). Tell the parent app to
// close the brain overlay; if opened standalone, go back.
(function(){ var b=document.getElementById('closeBtn'); if(!b)return;
  b.addEventListener('click', function(){
    try{ if(window.parent && window.parent!==window){ window.parent.postMessage('setayesh-brain-close','*'); return; } }catch(e){}
    try{ history.back(); }catch(e){}
  });
})();
</script>
<!-- three.js served LOCALLY (r128) so the brain works fully offline — no CDN. -->
<script src="/three.min.js"></script>
<script>
// Small built-in orbit controller: full 360° drag-rotate, wheel + pinch zoom,
// arrow-key / +/- zoom, and a slow auto-rotate. No external OrbitControls, works
// offline. Exposes zoomBy() so the on-screen +/− buttons and keys share one path.
function MiniOrbit(cam,dom){
  this.cam=cam;this.dom=dom;this.target=new THREE.Vector3();
  this.enableDamping=true;this.dampingFactor=.075;
  this.minDistance=2.4;this.maxDistance=9.5;this.zoomSpeed=1;
  this.minPolarAngle=.12;this.maxPolarAngle=Math.PI-.12;
  this.autoRotate=true;this.autoRotateSpeed=.3;   // slow, calm
  this._th=0;this._ph=0;this._scale=1;this._drag=false;this._lx=0;this._ly=0;this._pinch=0;
  var self=this;
  dom.addEventListener('pointerdown',function(e){self._drag=true;self._lx=e.clientX;self._ly=e.clientY;});
  window.addEventListener('pointerup',function(){self._drag=false;self._pinch=0;});
  window.addEventListener('pointermove',function(e){
    if(!self._drag)return;
    self._th-=(e.clientX-self._lx)*0.006;self._ph-=(e.clientY-self._ly)*0.006;
    self._lx=e.clientX;self._ly=e.clientY;
  });
  dom.addEventListener('wheel',function(e){e.preventDefault();
    self.zoomBy(e.deltaY>0?1:-1,Math.min(120,Math.abs(e.deltaY))/120);
  },{passive:false});
  dom.addEventListener('touchmove',function(e){
    if(e.touches.length!==2)return;e.preventDefault();
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(self._pinch)self._scale*=self._pinch/d;self._pinch=d;
  },{passive:false});
  dom.addEventListener('touchend',function(){self._pinch=0;});
}
MiniOrbit.prototype.zoomBy=function(dir,strength){   // dir>0 = out, dir<0 = in
  var f=0.12*(strength==null?1:strength)*this.zoomSpeed;
  this._scale*=(dir>0?1+f:1-f);
};
MiniOrbit.prototype.update=function(){
  var off=this.cam.position.clone().sub(this.target);
  var sph=new THREE.Spherical().setFromVector3(off);
  if(this.autoRotate&&!this._drag)this._th-=(2*Math.PI/60/60)*this.autoRotateSpeed;
  sph.theta+=this._th;sph.phi+=this._ph;
  sph.phi=Math.max(this.minPolarAngle,Math.min(this.maxPolarAngle,sph.phi));
  sph.radius*=this._scale;
  sph.radius=Math.max(this.minDistance,Math.min(this.maxDistance,sph.radius));
  sph.makeSafe();
  off.setFromSpherical(sph);
  this.cam.position.copy(this.target).add(off);
  this.cam.lookAt(this.target);
  var keep=this.enableDamping?(1-this.dampingFactor):0;
  this._th*=keep;this._ph*=keep;this._scale=1;
};
THREE.OrbitControls=MiniOrbit;
</script>
<script>
const BLUE=0x39b6ff,GOLD=0xffab3d,VIOLET=0xa878ff,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// Every part around the Agent. kind: b=AI engine, g=tool/capability, io=input/output.
const NODES=[
 // AI engines (blue)
 ["OpenRouter","hub","b","دروازه به ده‌ها مدل هوش دیگر."],
 ["OpenAI","neurology","b","مدل‌های GPT؛ یکی از موتورهای Failover."],
 ["Ollama","dns","b","مغز محلی، بدون اینترنت و کاملاً خصوصی."],
 ["Mistral","air","b","موتور اروپایی، سریع و ارزان."],
 ["Groq","bolt","b","پرسرعت و رایگان؛ Whisper هم دارد."],
 ["Cerebras","memory","b","بسیار سریع برای جوابِ فوری."],
 ["Gemini","auto_awesome","b","موتور گوگل؛ تحلیل و ساخت تصویر."],
 ["Claude","psychology","b","استدلال و نوشتنِ دقیق."],
 ["Memory","database","b","حافظه‌ی کوتاه‌مدت، بلندمدت و Vector."],
 ["Learning","school","b","یادگیری خودکار و Insight Engine."],
 ["Python","terminal","b","مغزِ آفلاین؛ آخرین پشتیبان."],
 // Tools / capabilities (gold)
 ["Tools","build","g","۶۲ ابزار واقعی که عامل اجرا می‌کند."],
 ["Devices","devices_other","g","دستگاه‌های خانه از Home Assistant."],
 ["Web","language","g","جستجو و تحقیق با منبع، اتوماسیونِ وب."],
 ["Code","code","g","اجرای کد در ۱۳ زبان و ساختِ پروژه."],
 ["Files","folder","g","ZIP، PDF، Word، Excel و تبدیلِ فرمت."],
 ["API","cloud","g","اتصال به گوگل، تلگرام و سرویس‌ها."],
 ["Smart Home","cottage","g","تلویزیون، پرینتر، دوربین، Tuya/LSC."],
 ["Security","shield","g","Vault، تأییدِ پدر، NetGuard و HTTPS."],
 // I/O (violet)
 ["Text","chat","io","ورودی و خروجیِ متنی."],
 ["Voice","mic","io","صدا به متن و متن به صدا."],
 ["Image","image","io","دیدن و ساختِ تصویر."],
 ["File","description","io","آپلود و دانلودِ فایل."],
 ["Web I/O","public","io","ورودی/خروجی از وب."],
 ["Device I/O","home","io","کنترل و پاسخِ دستگاه‌ها."]
];
const canvas=document.getElementById('c'),labels=document.getElementById('labels'),tip=document.getElementById('tip');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x04060c,.028);
const camera=new THREE.PerspectiveCamera(46,1,.1,100);
const controls=new THREE.OrbitControls(camera,canvas);
const world=new THREE.Group();scene.add(world);   // everything rotates together

// Soft round sprite used for the halo and the travelling pulses.
function glow(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'#fff');r.addColorStop(.3,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const G=glow();

// A calm spherical nebula around the Agent (symmetric — so it never looks
// one-sided). Faint particles that drift with the slow world rotation.
(function(){const N=innerWidth<700?2600:4200,P=[],C=[];const c1=new THREE.Color(BLUE),c2=new THREE.Color(0x9fd0ff);
 for(let i=0;i<N;i++){const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);
  const rr=1.15+Math.random()*1.0;const p=new THREE.Vector3(s*Math.cos(t),u*.82,s*Math.sin(t)).multiplyScalar(rr);
  P.push(p.x,p.y,p.z);const c=c1.clone().lerp(c2,Math.random()*.7);C.push(c.r,c.g,c.b);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
 world.add(new THREE.Points(g,new THREE.PointsMaterial({size:.03,map:G,vertexColors:true,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending})));
})();
// Distant starfield (does not rotate with the world — depth).
(function(){const n=700,p=[];for(let i=0;i<n;i++){const r=14+Math.random()*20,a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);
 p.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.05,color:0x46618f,map:G,transparent:true,opacity:.45,depthWrite:false,blending:THREE.AdditiveBlending})))})();

// Central halo behind the Agent core.
(function(){[[1.7,0xffffff,.5],[3.0,BLUE,.16]].forEach(([s,c,o])=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:G,color:c,opacity:o,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sp.scale.set(s,s,1);world.add(sp)})})();

// Nodes evenly on a sphere (Fibonacci) so they sit ALL around the Agent, 360°,
// never bunched on one side. R is the ring radius; core is at the origin.
const R=3.15, core=new THREE.Vector3(0,0,0);
const anchors=[];
const golden=Math.PI*(3-Math.sqrt(5));
NODES.forEach((nd,i)=>{
 const [name,icon,kind,info]=nd;
 const y=1-(i/(NODES.length-1))*2, rad=Math.sqrt(Math.max(0,1-y*y)), th=golden*i;
 const p=new THREE.Vector3(Math.cos(th)*rad, y*0.92, Math.sin(th)*rad).multiplyScalar(R);
 const el=document.createElement('button');el.className='node '+kind;el.type='button';
 const sub=kind==='b'?'موتور':kind==='g'?'ابزار':'ورودی/خروجی';
 el.innerHTML='<span class="ic"><span class="ms">'+icon+'</span></span>'+name+'<span class="sub">'+sub+'</span>';
 el.addEventListener('click',function(e){e.stopPropagation();showTip(el,name,info,icon,kind);});
 labels.appendChild(el);
 anchors.push({el,p,kind});
});

// The Agent core (HTML, projects to screen centre so it is dead-centre & faces you).
const coreEl=document.createElement('button');coreEl.className='core';coreEl.type='button';
coreEl.innerHTML='<div><b>عاملِ ستایش</b><span>Agent · هسته</span></div>';
coreEl.addEventListener('click',function(e){e.stopPropagation();showTip(coreEl,'عاملِ ستایش (Agent)','این همان «ایجنت» است: روی همه‌ی موتورها سوار می‌شود، پیام را می‌گیرد، از حافظه کمک می‌گیرد، بهترین موتور را انتخاب می‌کند، ابزار لازم را اجرا می‌کند و فایل/جوابِ نهایی را می‌سازد.','graph_3','');});
labels.appendChild(coreEl);

// Thin connecting cables node -> core, each with a slow light pulse travelling
// along it — a calm sign of a live connection, not a fake static glow.
const cableG=new THREE.Group();world.add(cableG);
const pulses=[];
const colOf=k=>k==='b'?BLUE:k==='g'?GOLD:VIOLET;
anchors.forEach(n=>{
 const hex=colOf(n.kind);
 const mid=n.p.clone().multiplyScalar(0.5).add(new THREE.Vector3(0,0.12,0));
 const curve=new THREE.QuadraticBezierCurve3(n.p.clone(),mid,core.clone());
 const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
  new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:.14,blending:THREE.AdditiveBlending}));
 cableG.add(line);
 const pu=new THREE.Sprite(new THREE.SpriteMaterial({map:G,color:hex,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
 pu.scale.set(.16,.16,1);cableG.add(pu);
 // slow, staggered so the whole thing breathes calmly
 pulses.push({pu,curve,t:Math.random(),v:.05+Math.random()*.05});
});

function showTip(el,t,d,icon,kind){const col=kind==='b'?'#2a9dff':kind==='g'?'#ffab3d':kind==='io'?'#a878ff':'#8fd0ff';
 tip.innerHTML='<div class="h"><span class="ic" style="background:'+col+'33;border:1px solid '+col+'"><span class="ms" style="color:'+col+'">'+icon+'</span></span><strong>'+t+'</strong></div><p>'+d+'</p>';
 tip.classList.add('on');const r=el.getBoundingClientRect();
 let x=r.left+r.width/2-140;x=Math.max(8,Math.min(innerWidth-288,x));let y=r.bottom+10;if(y>innerHeight-130)y=r.top-130;
 tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.classList.remove('on'),5200)}
canvas.addEventListener('pointerup',()=>{tip.classList.remove('on')});

// Zoom buttons + keyboard (arrows / +/-).
document.getElementById('zoomIn').addEventListener('click',()=>controls.zoomBy(-1,1));
document.getElementById('zoomOut').addEventListener('click',()=>controls.zoomBy(1,1));
addEventListener('keydown',e=>{
 if(e.key==='Escape'){(window.parent&&window.parent!==window&&window.parent.postMessage('setayesh-brain-close','*'))||history.back();return;}
 if(e.key==='ArrowUp'||e.key==='+'||e.key==='='){e.preventDefault();controls.zoomBy(-1,1);}
 else if(e.key==='ArrowDown'||e.key==='-'||e.key==='_'){e.preventDefault();controls.zoomBy(1,1);}
});

let initDist=7;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
 const vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
 initDist=Math.max(R*1.12/vf,R*1.12/(vf*camera.aspect))+1.2;
 controls.minDistance=R*0.75;controls.maxDistance=initDist+4.5;
 if(!resize._done){camera.position.set(0,0.4,initDist);resize._done=true;}
 controls.target.set(0,0,0);camera.updateProjectionMatrix()}
addEventListener('resize',resize);

const v=new THREE.Vector3(),dir=new THREE.Vector3(),clk=new THREE.Clock();
let hintTimer=setTimeout(()=>document.getElementById('hint').classList.add('gone'),6000);
function loop(){const dt=Math.min(clk.getDelta(),.05);
 // Slow pulses gliding node -> core, gently fading in and out at the ends.
 pulses.forEach(p=>{if(!reduce)p.t=(p.t+p.v*dt)%1;const pt=p.curve.getPoint(p.t);p.pu.position.copy(pt);
  const edge=Math.min(p.t,1-p.t);p.pu.material.opacity=Math.max(.12,Math.min(1,edge*6))*.95;});
 controls.update();renderer.render(scene,camera);
 const w=innerWidth,h=innerHeight;camera.getWorldDirection(dir);
 // Project the core (origin, in world space) and every node to screen.
 const cw=new THREE.Vector3().applyMatrix4(world.matrixWorld);cw.project(camera);
 coreEl.style.transform='translate('+((cw.x*.5+.5)*w)+'px,'+((-cw.y*.5+.5)*h)+'px) translate(-50%,-50%)';
 anchors.forEach(a=>{v.copy(a.p).applyMatrix4(world.matrixWorld);
  const face=v.clone().sub(camera.position).normalize().dot(dir);   // is it on the front side?
  v.project(camera);
  a.el.style.transform='translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*h)+'px) translate(-50%,-50%)';
  const vis=face>0.02;a.el.style.opacity=vis?1:0;a.el.style.pointerEvents=vis?'auto':'none';
  a.el.style.zIndex=vis?String(2+Math.round(face*6)):'0';});
 requestAnimationFrame(loop)}
resize();loop();
</script>
</body>
</html>
