<!doctype html>
<!-- SETAYESH_BUILD 9.9.190 -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setayesh — مغز</title>
<style>
:root{
 --ink:#FAFAFA;--ink2:#A1A1AA;--ink3:#71717A;--line:#ffffff18;--panel:rgba(10,15,26,.6);
 --blue:#39b6ff;--gold:#ffab3d;--violet:#a878ff;
 --bg1:#0a1428;--bg2:#04060c;color-scheme:dark;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Vazirmatn,Tahoma,system-ui,sans-serif}
body{background:radial-gradient(120% 90% at 50% 46%,var(--bg1) 0%,#060a15 48%,var(--bg2) 100%)}
.lat{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;direction:ltr;font-feature-settings:"tnum"}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;opacity:.85}
#wires{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}

.node{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;white-space:nowrap;
 display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink);
 padding:5px 12px 5px 5px;border-radius:99px;background:var(--panel);backdrop-filter:blur(9px);
 border:1px solid var(--line);box-shadow:0 3px 16px #0007;transition:border-color .2s,background .2s,transform .15s}
.node .d{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#04121e}
.node .r{font-size:9px;color:var(--ink3);margin-inline-start:2px}
.node.b .d{background:linear-gradient(140deg,#2a6bff,#39c0ff)}
.node.g .d{background:linear-gradient(140deg,#ff7a00,#ffc24d)}
.node.io .d{background:linear-gradient(140deg,#8a5cff,#c56bff);color:#fff}
.node:hover,.node:focus-visible{outline:none;border-color:#ffffff66;background:rgba(16,26,46,.82);z-index:9}

.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
 width:clamp(112px,12vw,152px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:radial-gradient(circle at 50% 42%,#f2f9ff 0,#9ad6ff 26%,#2f7dff 58%,#0a2f7a 100%);
 box-shadow:0 0 0 1px #bfe4ff77,0 0 34px 8px #38b4ff5c,0 0 90px 26px #2a7aff30,inset 0 -8px 22px #0a2f7a99;
 color:#04122e;font-weight:700}
.core::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid #7fd0ff44;
 animation:ring 3.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.86);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.core b{display:block;font-size:clamp(14px,1.5vw,18px);letter-spacing:.2px}
.core span{display:block;font-size:clamp(8px,.95vw,11px);font-weight:500;opacity:.85;letter-spacing:.5px;margin-top:1px}

.tip{position:fixed;z-index:20;max-width:min(280px,86vw);padding:13px 15px;border-radius:16px;
 background:rgba(9,15,28,.92);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 20px 50px #000a;
 opacity:0;transform:translateY(6px) scale(.98);transition:.22s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tip.on{opacity:1;transform:none}
.tip .h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tip .h .d{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.tip strong{font-size:14px;font-weight:700}
.tip p{margin:0;font-size:12.5px;line-height:1.8;color:#c4d4ec}

.col-h{position:fixed;z-index:3;font-size:11px;letter-spacing:1px;color:var(--ink2);pointer-events:none;text-transform:uppercase}
.col-h.l{inset-inline-start:0;text-align:start}.col-h.r{inset-inline-end:0;text-align:end}
.close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:15;height:38px;padding:0 15px;border-radius:19px;
 background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);color:#cfe0ff;cursor:pointer;
 display:flex;align-items:center;gap:6px;font:inherit;font-size:13px}
.brand{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;
 font-size:10px;letter-spacing:3px;color:#3a4a66;text-transform:uppercase;pointer-events:none;opacity:.5}
@media (max-width:640px){.node{font-size:11px;padding:4px 9px 4px 4px}.node .d{width:19px;height:19px}.node .r{display:none}}
@media (prefers-reduced-motion:reduce){.core::before{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="مغز سه‌بعدی ستایش"></canvas>
<svg id="wires" aria-hidden="true"></svg>
<div id="labels"></div>
<div class="tip" id="tip" role="dialog" aria-live="polite"></div>
<div class="col-h l" id="colL">مغزِ هوش</div>
<div class="col-h r" id="colR">ابزارها و سیستم</div>
<button class="close" id="closeBtn" type="button">✕ بستن</button>
<div class="brand">SETAYESH</div>
<script>
// Close via addEventListener (not an inline onclick= attribute; app CSP blocks those).
(function(){var b=document.getElementById('closeBtn');if(!b)return;
 b.addEventListener('click',function(){try{if(window.parent&&window.parent!==window){window.parent.postMessage('setayesh-brain-close','*');return;}}catch(e){}try{history.back();}catch(e){}});})();
</script>
<script src="/three.min.js"></script>
<script>
(function(){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const canvas=document.getElementById('c'),labels=document.getElementById('labels'),tip=document.getElementById('tip'),svg=document.getElementById('wires');
 const NS='http://www.w3.org/2000/svg';
 const BLUE='#39b6ff',GOLD='#ffab3d',VIOLET='#a878ff';

 // ENGINES → tidy left column (blue). TOOLS → tidy right column (gold).
 // IO → a row along the bottom. Fixed 2D layout: never one-sided, never overlaps.
 const ENGINES=[
  ['OpenRouter','OR','دروازه به ده‌ها مدلِ هوشِ دیگر.'],
  ['OpenAI','AI','مدل‌های GPT؛ یکی از موتورهای Failover.'],
  ['Ollama','OL','مغزِ محلی، بدونِ اینترنت و خصوصی.'],
  ['Mistral','MI','موتورِ اروپایی، سریع و ارزان.'],
  ['Groq','GQ','پرسرعت و رایگان؛ Whisper هم دارد.'],
  ['Cerebras','CB','بسیار سریع برای جوابِ فوری.'],
  ['Gemini','GE','موتورِ گوگل؛ تحلیل و ساختِ تصویر.'],
  ['Claude','CL','استدلال و نوشتنِ دقیق.'],
  ['Python','PY','مغزِ آفلاین؛ آخرین پشتیبان.']];
 const TOOLS=[
  ['Tools','TL','۶۲ ابزارِ واقعی که عامل اجرا می‌کند.'],
  ['Web','WB','جستجو و تحقیق با منبع، اتوماسیونِ وب.'],
  ['Code','CD','اجرای کد در ۱۳ زبان و ساختِ پروژه.'],
  ['Files','FL','ZIP، PDF، Word، Excel و تبدیلِ فرمت.'],
  ['Devices','DV','دستگاه‌های خانه از Home Assistant.'],
  ['Smart Home','SH','تلویزیون، پرینتر، دوربین، Tuya/LSC.'],
  ['Memory','ME','حافظهٔ کوتاه‌مدت، بلندمدت و Vector.'],
  ['Learning','LR','یادگیریِ خودکار و Insight Engine.'],
  ['Security','SC','Vault، تأییدِ پدر، NetGuard و HTTPS.']];
 const IOS=[['Text','TX','ورودی/خروجیِ متنی.'],['Voice','VC','صدا↔متن.'],['Image','IM','دیدن و ساختِ تصویر.'],
  ['File','FI','آپلود/دانلودِ فایل.'],['Web','WO','ورودی/خروجی از وب.'],['Device','DO','کنترلِ دستگاه‌ها.']];

 // ---- Build the chips (fixed 2D overlay) ---------------------------------
 const chips=[];   // {el, kind, line, pulse, dir, t, v, ax,ay}
 function chip(name,ab,info,kind){
  const el=document.createElement('div');el.className='node '+kind;
  const role=kind==='b'?'موتور':kind==='g'?'ابزار':'I/O';
  el.innerHTML='<span class="d"></span>'+name+'<span class="r">'+role+'</span>';el.querySelector('.d').textContent=ab;
  el.addEventListener('click',e=>{e.stopPropagation();showTip(el,name,info,kind)});labels.appendChild(el);
  const col=kind==='b'?BLUE:kind==='g'?GOLD:VIOLET;
  const ln=document.createElementNS(NS,'line');ln.setAttribute('stroke',col);ln.setAttribute('stroke-width','1');
  ln.setAttribute('stroke-opacity','.28');svg.appendChild(ln);
  const pu=document.createElementNS(NS,'circle');pu.setAttribute('r','3');pu.setAttribute('fill',col);svg.appendChild(pu);
  const c={el,kind,ln,pu,dir:chips.length%2?1:-1,t:Math.random(),v:.10+Math.random()*.08,ax:0,ay:0};
  chips.push(c);return c;
 }
 ENGINES.forEach(([n,a,i])=>chip(n,a,i,'b'));
 TOOLS.forEach(([n,a,i])=>chip(n,a,i,'g'));
 IOS.forEach(([n,a,i])=>chip(n,a,i,'io'));

 // Agent core — fixed dead centre, always visible.
 const coreEl=document.createElement('div');coreEl.className='core';
 coreEl.innerHTML='<b>عاملِ ستایش</b><span class="lat">Setayesh · Agent</span>';
 coreEl.addEventListener('click',e=>{e.stopPropagation();showTip(coreEl,'عاملِ ستایش (Agent)','هستهٔ مرکزی که روی همهٔ موتورها سوار است: پیام را می‌گیرد، از حافظه کمک می‌گیرد، بهترین موتور را انتخاب می‌کند، ابزارِ لازم را اجرا می‌کند و فایل/جوابِ نهایی را می‌سازد.','b')});
 labels.appendChild(coreEl);

 function showTip(el,t,d,kind){const col=kind==='b'?BLUE:kind==='g'?GOLD:VIOLET;
  tip.innerHTML='<div class="h"><span class="d" style="background:'+col+'">●</span><strong>'+t+'</strong></div><p>'+d+'</p>';
  tip.classList.add('on');const r=el.getBoundingClientRect();let x=r.left+r.width/2-140;x=Math.max(8,Math.min(innerWidth-288,x));
  let y=r.bottom+10;if(y>innerHeight-130)y=r.top-130;tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.classList.remove('on'),5200)}
 addEventListener('pointerdown',e=>{if(e.target===canvas)tip.classList.remove('on')});

 // ---- Layout: two even columns + bottom row; agent centre ----------------
 let cx=0,cy=0;
 function layout(){
  const W=innerWidth,H=innerHeight;cx=W/2;cy=H/2;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width',W);svg.setAttribute('height',H);
  const eng=chips.filter(c=>c.kind==='b'),tol=chips.filter(c=>c.kind==='g'),io=chips.filter(c=>c.kind==='io');
  const leftX=Math.max(96,W*0.16), rightX=Math.min(W-96,W*0.84);
  const top=H*0.12, bot=H*0.86, span=bot-top;
  const place=(arr,x)=>arr.forEach((c,i)=>{const y=arr.length>1?top+i*(span/(arr.length-1)):cy;
    c.el.style.left=x+'px';c.el.style.top=y+'px';c.ax=x;c.ay=y});
  place(eng,leftX);place(tol,rightX);
  const iy=H*0.93, ix0=W*0.30, ix1=W*0.70;
  io.forEach((c,i)=>{const x=io.length>1?ix0+i*((ix1-ix0)/(io.length-1)):cx;
   c.el.style.left=x+'px';c.el.style.top=iy+'px';c.ax=x;c.ay=iy});
  // column headers
  const cl=document.getElementById('colL'),cr=document.getElementById('colR');
  cl.style.top=(top-30)+'px';cl.style.insetInlineStart=(leftX-40)+'px';
  cr.style.top=(top-30)+'px';cr.style.insetInlineEnd=(W-rightX-40)+'px';
  // wire endpoints: from a point just inside each chip toward the centre
  chips.forEach(c=>{const dx=cx-c.ax,dy=cy-c.ay,L=Math.hypot(dx,dy)||1;const ux=dx/L,uy=dy/L;
   const x1=c.ax+ux*40,y1=c.ay+uy*18;const x2=cx-ux*66,y2=cy-uy*66;
   c.ln.setAttribute('x1',x1);c.ln.setAttribute('y1',y1);c.ln.setAttribute('x2',x2);c.ln.setAttribute('y2',y2);
   c._p1={x:x1,y:y1};c._p2={x:x2,y:y2}});
 }
 addEventListener('resize',layout);

 // ---- 3D brain backdrop (centred, slow rotation, ambience only) ----------
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x04060c,.032);
 const camera=new THREE.PerspectiveCamera(44,1,.1,100);
 const world=new THREE.Group();scene.add(world);
 function glow(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.32,'rgba(255,255,255,.5)');
  r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
 const G=glow();
 const RX=2.0,RY=2.6,RZ=1.6,GAP=.12;
 const nz=(x,y,z)=>Math.sin(x*2.3+Math.sin(y*1.9+z))+Math.sin(y*2.9+Math.cos(z*2.1+x))+Math.sin(z*2.5+Math.sin(x*1.7-y));
 function surf(side,dx,dy,dz,k){k=k||1;const f=1+.045*nz(dx*3,dy*3,dz*3);
  return new THREE.Vector3(side*(GAP+RX*Math.pow(dx,.85)*f*k),RY*dy*f*k,RZ*dz*f*k)}
 function hemi(side,hex){const col=new THREE.Color(hex),hot=new THREE.Color(0xffffff),deep=col.clone().multiplyScalar(.32);
  const N=innerWidth<700?5200:9000,P=[],C=[];
  for(let i=0;i<N;i++){const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);
   const dx=Math.abs(s*Math.cos(t)),dy=u,dz=s*Math.sin(t);const g=Math.sin(nz(dx*4.2,dy*4.2,dz*4.2)*3.2);
   if(Math.abs(g)<.16&&Math.random()<.85)continue;const depth=Math.random()<.16?.8+Math.random()*.18:1;
   const p=surf(side,dx,dy,dz,depth);P.push(p.x,p.y,p.z);
   const c=depth<1?deep.clone():col.clone().lerp(hot,Math.max(0,g)*.3);C.push(c.r,c.g,c.b)}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  world.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.042,map:G,vertexColors:true,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending})));
  const lm=new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:.24,blending:THREE.AdditiveBlending});
  for(let j=0;j<46;j++){let d=new THREE.Vector3(Math.random(),Math.random()*2-1,Math.random()*2-1).normalize();d.x=Math.abs(d.x);
   const pts=[];let a=Math.random()*6.28;
   for(let s=0;s<20;s++){pts.push(surf(side,d.x,d.y,d.z,1.004));a+=nz(d.x*5,d.y*5,d.z*5)*.55;
    d.add(new THREE.Vector3(Math.cos(a),Math.sin(a),Math.sin(a*.7)).multiplyScalar(.055)).normalize();d.x=Math.abs(d.x)}
   world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm))}}
 hemi(-1,0x39b6ff);hemi(1,0xffab3d);
 world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3([new THREE.Vector3(0,RY*.9,.3),new THREE.Vector3(0,0,RZ*.5),new THREE.Vector3(0,-RY*.9,.3)]).getPoints(36)),new THREE.LineBasicMaterial({color:0xeaf2ff,transparent:true,opacity:.3,blending:THREE.AdditiveBlending})));

 let camDist=9;
 function resize3(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));camDist=Math.max(RY*1.2/vf,(RX+GAP)*1.35/(vf*camera.aspect))+RZ+1.2;camera.updateProjectionMatrix()}
 addEventListener('resize',resize3);

 // ---- One animation loop: slow brain spin + travelling wire pulses -------
 let th=0;const clk=new THREE.Clock();
 function loop(){const dt=Math.min(clk.getDelta(),.05);
  if(!reduce)th-=(2*Math.PI/60/60)*.1;                       // very slow spin
  camera.position.set(Math.sin(th)*camDist,0,Math.cos(th)*camDist);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  chips.forEach(c=>{if(!c._p1)return;if(!reduce)c.t=(c.t+c.v*dt)%1;
   const t=c.dir>0?c.t:1-c.t;const x=c._p1.x+(c._p2.x-c._p1.x)*t,y=c._p1.y+(c._p2.y-c._p1.y)*t;
   c.pu.setAttribute('cx',x);c.pu.setAttribute('cy',y);
   const edge=Math.min(t,1-t);c.pu.setAttribute('opacity',Math.max(.15,Math.min(1,edge*6)).toFixed(2))});
  requestAnimationFrame(loop)}
 resize3();layout();loop();
 // Esc closes; +/- and arrows nudge the backdrop zoom (labels stay fixed).
 addEventListener('keydown',e=>{if(e.key==='Escape'){(window.parent&&window.parent!==window&&window.parent.postMessage('setayesh-brain-close','*'))||history.back();}});
})();
</script>
</body>
</html>
