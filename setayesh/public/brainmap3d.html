<script>
// Tiny built-in orbit controller (drag-rotate + wheel/pinch-zoom + autorotate),
// so the brain needs NO external OrbitControls script and works offline. It
// mirrors the small slice of the OrbitControls API this scene uses: it reads
// camera.position each frame (so an external reset-lerp is respected) and writes
// it back from a spherical around `target`.
function MiniOrbit(cam,dom){
  this.cam=cam;this.dom=dom;this.target=new THREE.Vector3();
  this.enableDamping=false;this.dampingFactor=.06;this.enablePan=false;
  this.minDistance=0;this.maxDistance=Infinity;this.zoomSpeed=1;
  this.minPolarAngle=0;this.maxPolarAngle=Math.PI;this.autoRotate=false;this.autoRotateSpeed=2;
  this._th=0;this._ph=0;this._scale=1;this._drag=false;this._lx=0;this._ly=0;this._pinch=0;
  var self=this;
  dom.addEventListener('pointerdown',function(e){self._drag=true;self._lx=e.clientX;self._ly=e.clientY;});
  window.addEventListener('pointerup',function(){self._drag=false;self._pinch=0;});
  window.addEventListener('pointermove',function(e){
    if(!self._drag)return;
    self._th-=(e.clientX-self._lx)*0.005;self._ph-=(e.clientY-self._ly)*0.005;
    self._lx=e.clientX;self._ly=e.clientY;
  });
  dom.addEventListener('wheel',function(e){e.preventDefault();
    self._scale*=(e.deltaY>0?1+0.0016*self.zoomSpeed*Math.min(120,Math.abs(e.deltaY)):1-0.0016*self.zoomSpeed*Math.min(120,Math.abs(e.deltaY)));
  },{passive:false});
  // Pinch-to-zoom (two fingers).
  dom.addEventListener('touchmove',function(e){
    if(e.touches.length!==2)return;e.preventDefault();
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(self._pinch)self._scale*=self._pinch/d;self._pinch=d;
  },{passive:false});
  dom.addEventListener('touchend',function(){self._pinch=0;});
}
MiniOrbit.prototype.update=function(){
  var off=this.cam.position.clone().sub(this.target);
  var sph=new THREE.Spherical().setFromVector3(off);
  if(this.autoRotate&&!this._drag)this._th-=(2*Math.PI/60/60)*this.autoRotateSpeed*2;
  sph.theta+=this._th;sph.phi+=this._ph;
  sph.phi=Math.max(this.minPolarAngle,Math.min(this.maxPolarAngle,sph.phi));
  sph.radius*=this._scale;
  sph.radius=Math.max(this.minDistance,Math.min(this.maxDistance,sph.radius));
  sph.makeSafe();
  off.setFromSpherical(sph);
  this.cam.position.copy(this.target).add(off);
  this.cam.lookAt(this.target);
  var keep=this.enableDamping?(1-this.dampingFactor):0;
  this._th*=keep;this._ph*=keep;this._scale=1;
};
THREE.OrbitControls=MiniOrbit;   // the scene below constructs THREE.OrbitControls
</script>

function glow(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);
 r.addColorStop(0,'#fff');r.addColorStop(.32,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}

function hemi(side,hex){
 const col=new THREE.Color(hex),hot=new THREE.Color(0xffffff),deep=col.clone().multiplyScalar(.3);
 const N=innerWidth<700?6000:10500,P=[],C=[];
 for(let i=0;i<N;i++){
  const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);
  const dx=Math.abs(s*Math.cos(t)),dy=u,dz=s*Math.sin(t);

  const p=surf(side,dx,dy,dz,depth);P.push(p.x,p.y,p.z);
  const c=depth<1?deep.clone():col.clone().lerp(hot,Math.max(0,g)*.3+(Math.random()<.03?.55:0));C.push(c.r,c.g,c.b);
 }

 const lm=new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:.3,blending:THREE.AdditiveBlending});
 for(let j=0;j<58;j++){let d=new THREE.Vector3(Math.random(),Math.random()*2-1,Math.random()*2-1).normalize();d.x=Math.abs(d.x);
  const pts=[];let a=Math.random()*6.28;
  for(let s=0;s<22;s++){pts.push(surf(side,d.x,d.y,d.z,1.004));a+=nz(d.x*5,d.y*5,d.z*5)*.55;

hemi(-1,BLUE);hemi(1,GOLD);
[[3.2,0xffffff,.4],[5.4,BLUE,.16],[5.4,GOLD,.11]].forEach(([s,c,o],i)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:G,color:c,opacity:o,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
 sp.scale.set(s,s,1);sp.position.set(i==1?-.5:i==2?.5:0,0,RZ*.85);brain.add(sp)});
brain.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3([new THREE.Vector3(0,RY*.92,.3),new THREE.Vector3(0,0,RZ+.05),new THREE.Vector3(0,-RY*.92,.3)]).getPoints(40)),
 new THREE.LineBasicMaterial({color:0xeaf2ff,transparent:true,opacity:.5,blending:THREE.AdditiveBlending})));
(function(){const n=900,p=[];for(let i=0;i<n;i++){const r=12+Math.random()*22,a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);
 p.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));

function buildOuter(){
  const nodes=anchors.filter(a=>!a.core);
  nodes.forEach(n=>{
    const hex=n.kind==='b'?BLUE:n.kind==='g'?GOLD:VIOLET;

    const curve=new THREE.QuadraticBezierCurve3(n.p.clone(),mid,outPt);
    const pts=curve.getPoints(28);
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),

addEventListener('resize',resize);
const v=new THREE.Vector3(),dir=new THREE.Vector3(),clk=new THREE.Clock();
function loop(){const dt=Math.min(clk.getDelta(),.05);
 const dist=camera.position.length();
 if(dist < initDist-0.5) setRevealed(true);
 else if(dist > initDist-0.15) setRevealed(false);
 pulses.forEach(p=>{if(revealed&&!reduce)p.t=(p.t+p.v*dt)%1;p.s.material.opacity=revealed?.9:0;p.s.position.lerpVectors(p.a,p.b,p.t)});
 outerPulses.forEach(p=>{if(!reduce)p.t=(p.t+p.v*dt*p.dir+1)%1;const pt=p.curve.getPoint(p.t);p.pu.position.copy(pt);p.pu.material.opacity=.95});
 if(target){camera.position.lerp(target.pos,.08);if(camera.position.distanceTo(target.pos)<.05)target=null}
 controls.update();renderer.render(scene,camera);
 const w=innerWidth,h=innerHeight;camera.getWorldDirection(dir);
 anchors.forEach(a=>{v.copy(a.p).applyMatrix4(brain.matrixWorld);const face=v.clone().sub(camera.position).normalize().dot(dir);
  v.project(camera);a.el.style.transform='translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*h)+'px) translate(-50%,-50%)';
  const vis=revealed&&face>0;a.el.style.opacity=vis?1:0;a.el.style.pointerEvents=vis?'auto':'none'});
 requestAnimationFrame(loop)}
resize();loop();
// Let the parent app close this view with the Esc key too.
addEventListener('keydown',e=>{if(e.key==='Escape'){(window.parent&&window.parent!==window&&window.parent.postMessage('setayesh-brain-close','*'))||history.back();}});
</script>
</body>
</html>
