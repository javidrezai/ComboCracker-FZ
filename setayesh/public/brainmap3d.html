<!doctype html>
<!-- SETAYESH_BUILD 9.9.189 -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setayesh — مغز</title>
<!-- System font stack (same as the app): no external font CDN — the app's CSP
     blocks it and the server runs offline. Segoe UI/Vazirmatn render Persian
     cleanly on the owner's Windows; latin uses the UI font. -->
<style>
:root{
 --ink:#FAFAFA;--ink2:#A1A1AA;--ink3:#71717A;--line:#ffffff16;--panel:rgba(10,15,26,.55);
 --blue:#39b6ff;--gold:#ffab3d;--violet:#a878ff;--accent:#39b6ff;
 --bg1:#0a1428;--bg2:#04060c;
 color-scheme:dark;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Vazirmatn,Tahoma,system-ui,sans-serif}
body{background:radial-gradient(120% 90% at 50% 46%,var(--bg1) 0%,#060a15 48%,var(--bg2) 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lat{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;direction:ltr;font-feature-settings:"tnum"}
/* Projected node chips — small, professional */
.labels{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease}
.labels.on{opacity:1}
.node{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
 display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ink);
 padding:4px 11px 4px 4px;border-radius:99px;background:rgba(8,12,22,.5);backdrop-filter:blur(9px);
 border:1px solid var(--line);box-shadow:0 2px 14px #0006;transition:opacity .45s ease,border-color .2s,background .2s}
.node .d{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#04121e}
.node .r{font-size:9px;color:var(--ink3);margin-inline-start:2px}
.node.b .d{background:linear-gradient(140deg,#2a6bff,#39c0ff)}
.node.g .d{background:linear-gradient(140deg,#ff7a00,#ffc24d)}
.node.io .d{background:linear-gradient(140deg,#8a5cff,#c56bff);color:#fff}
.node:hover,.node:focus-visible{outline:none;border-color:#ffffff59;background:rgba(14,24,44,.72);z-index:9}
/* Agent core — always centred, the seam between the two hemispheres */
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
 width:clamp(104px,12vw,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:radial-gradient(circle at 50% 42%,#f2f9ff 0,#9ad6ff 26%,#2f7dff 58%,#0a2f7a 100%);
 border:none;box-shadow:0 0 0 1px #bfe4ff77,0 0 30px 8px #38b4ff55,0 0 82px 24px #2a7aff2e,inset 0 -8px 22px #0a2f7a99;
 color:#04122e;font-weight:700}
.core b{display:block;font-size:clamp(13px,1.5vw,17px);letter-spacing:.2px}
.core span{display:block;font-size:clamp(8px,.95vw,11px);font-weight:500;opacity:.82;letter-spacing:.5px;margin-top:1px}
.tip{position:fixed;z-index:20;max-width:min(280px,86vw);padding:13px 15px;border-radius:16px;
 background:rgba(9,15,28,.9);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 20px 50px #000a;
 opacity:0;transform:translateY(6px) scale(.98);transition:.22s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tip.on{opacity:1;transform:none}
.tip .h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tip .h .d{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#04121e}
.tip strong{font-size:14px;font-weight:700}
.tip p{margin:0;font-size:12.5px;line-height:1.8;color:#c4d4ec}
.legend{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;z-index:6;
 display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2);pointer-events:none;opacity:0;transition:opacity .7s}
.legend.on{opacity:1}
.legend .row{display:flex;align-items:center;gap:8px}.legend .sw{width:12px;height:12px;border-radius:4px}
.hint{position:fixed;bottom:calc(38px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;
 font-size:12px;color:var(--ink3);pointer-events:none;transition:opacity .8s}
.hint.gone{opacity:0}
.brand{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;
 font-size:10px;letter-spacing:3px;color:#3a4a66;text-transform:uppercase;pointer-events:none;opacity:.5}
.close{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:15;height:38px;padding:0 15px;border-radius:19px;
 background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);color:#cfe0ff;cursor:pointer;
 display:flex;align-items:center;gap:6px;font:inherit;font-size:13px}
@media (max-width:560px){.legend{display:none}}
@media (prefers-reduced-motion:reduce){.node,.labels,.legend{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="مغز سه‌بعدی ستایش"></canvas>
<div class="labels" id="labels"></div>
<div class="tip" id="tip" role="dialog" aria-live="polite"></div>
<div class="legend" id="legend"></div>
<button class="close" id="closeBtn" type="button">✕ بستن</button>
<script>
// Close via addEventListener (never an inline onclick= attribute — the app CSP
// script-src-attr 'none' blocks those). Tell the parent app to close; else go back.
(function(){var b=document.getElementById('closeBtn');if(!b)return;
 b.addEventListener('click',function(){try{if(window.parent&&window.parent!==window){window.parent.postMessage('setayesh-brain-close','*');return;}}catch(e){}try{history.back();}catch(e){}});})();
</script>
<div class="hint" id="hint">بچرخان · با اسکرول / دو انگشت / کلیدهای بالا‌پایین زوم کن تا نام‌ها و اتصال‌ها ظاهر شوند</div>
<div class="brand">SETAYESH</div>
<!-- three.js LOCAL (r128) — fully offline, no CDN. -->
<script src="/three.min.js"></script>
<script>
(function(){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const canvas=document.getElementById('c'),labels=document.getElementById('labels'),tip=document.getElementById('tip'),legend=document.getElementById('legend');
 const BLUE=0x39b6ff,GOLD=0xffab3d,VIOLET=0xa878ff;
 // Engines live over the BLUE (left) hemisphere; tools over the GOLD (right).
 const AI=[
  ['OpenRouter','OR','دروازه به ده‌ها مدلِ هوشِ دیگر.',.74],
  ['OpenAI','AI','مدل‌های GPT؛ یکی از موتورهای Failover.',.55],
  ['Ollama','OL','مغزِ محلی، بدونِ اینترنت و خصوصی.',.36],
  ['Mistral','MI','موتورِ اروپایی، سریع و ارزان.',.17],
  ['Groq','GQ','پرسرعت و رایگان؛ Whisper هم دارد.',-.02],
  ['Cerebras','CB','بسیار سریع برای جوابِ فوری.',-.21],
  ['Gemini','GE','موتورِ گوگل؛ تحلیل و ساختِ تصویر.',-.4],
  ['Claude','CL','استدلال و نوشتنِ دقیق.',-.58],
  ['Python','PY','مغزِ آفلاین؛ آخرین پشتیبان.',-.76]];
 const TL=[
  ['Tools','TL','۶۲ ابزارِ واقعی که عامل اجرا می‌کند.',.74],
  ['Devices','DV','دستگاه‌های خانه از Home Assistant.',.55],
  ['Web','WB','جستجو و تحقیق با منبع، اتوماسیونِ وب.',.36],
  ['Code','CD','اجرای کد در ۱۳ زبان و ساختِ پروژه.',.17],
  ['Files','FL','ZIP، PDF، Word، Excel و تبدیلِ فرمت.',-.02],
  ['API','AP','اتصال به گوگل، تلگرام و سرویس‌ها.',-.21],
  ['Smart Home','SH','تلویزیون، پرینتر، دوربین، Tuya/LSC.',-.4],
  ['Memory','ME','حافظهٔ کوتاه‌مدت، بلندمدت و Vector.',-.58],
  ['Security','SC','Vault، تأییدِ پدر، NetGuard و HTTPS.',-.76]];
 const IO=[['Text','TX','ورودی/خروجیِ متنی.'],['Voice','VC','صدا به متن و متن به صدا.'],
  ['Image','IM','دیدن و ساختِ تصویر.'],['File','FI','آپلود و دانلودِ فایل.'],
  ['Web','WO','ورودی/خروجی از وب.'],['Device','DO','کنترل و پاسخِ دستگاه‌ها.']];

 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x04060c,.03);
 const camera=new THREE.PerspectiveCamera(44,1,.1,100);
 const world=new THREE.Group();scene.add(world);
 function glow(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.32,'rgba(255,255,255,.5)');
  r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
 const G=glow();
 const RX=2.0,RY=2.62,RZ=1.62,GAP=.13;
 const nz=(x,y,z)=>Math.sin(x*2.3+Math.sin(y*1.9+z))+Math.sin(y*2.9+Math.cos(z*2.1+x))+Math.sin(z*2.5+Math.sin(x*1.7-y));
 function surf(side,dx,dy,dz,k){k=k||1;const f=1+.045*nz(dx*3,dy*3,dz*3);
  return new THREE.Vector3(side*(GAP+RX*Math.pow(dx,.85)*f*k),RY*dy*f*k,RZ*dz*f*k)}
 // Two hemispheres of neural points + filaments (blue left, gold right).
 function hemi(side,hex){
  const col=new THREE.Color(hex),hot=new THREE.Color(0xffffff),deep=col.clone().multiplyScalar(.32);
  const N=innerWidth<700?6000:10500,P=[],C=[];
  for(let i=0;i<N;i++){const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);
   const dx=Math.abs(s*Math.cos(t)),dy=u,dz=s*Math.sin(t);
   const g=Math.sin(nz(dx*4.2,dy*4.2,dz*4.2)*3.2);
   if(Math.abs(g)<.16&&Math.random()<.85)continue;
   const depth=Math.random()<.16?.8+Math.random()*.18:1;const p=surf(side,dx,dy,dz,depth);P.push(p.x,p.y,p.z);
   const c=depth<1?deep.clone():col.clone().lerp(hot,Math.max(0,g)*.3+(Math.random()<.03?.5:0));C.push(c.r,c.g,c.b)}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  world.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.045,map:G,vertexColors:true,transparent:true,opacity:.95,depthWrite:false,blending:THREE.AdditiveBlending})));
  const lm=new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:.3,blending:THREE.AdditiveBlending});
  for(let j=0;j<54;j++){let d=new THREE.Vector3(Math.random(),Math.random()*2-1,Math.random()*2-1).normalize();d.x=Math.abs(d.x);
   const pts=[];let a=Math.random()*6.28;
   for(let s=0;s<22;s++){pts.push(surf(side,d.x,d.y,d.z,1.004));a+=nz(d.x*5,d.y*5,d.z*5)*.55;
    d.add(new THREE.Vector3(Math.cos(a),Math.sin(a),Math.sin(a*.7)).multiplyScalar(.055)).normalize();d.x=Math.abs(d.x)}
   world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm))}
 }
 hemi(-1,BLUE);hemi(1,GOLD);
 // Central halo + the bright seam where the two hemispheres meet.
 [[3.0,0xffffff,.45],[5.2,BLUE,.14],[5.2,GOLD,.1]].forEach(([s,c,o],i)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:G,color:c,opacity:o,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sp.scale.set(s,s,1);sp.position.set(i==1?-.5:i==2?.5:0,0,RZ*.4);world.add(sp)});
 world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3([new THREE.Vector3(0,RY*.92,.3),new THREE.Vector3(0,0,RZ*.5),new THREE.Vector3(0,-RY*.92,.3)]).getPoints(40)),new THREE.LineBasicMaterial({color:0xeaf2ff,transparent:true,opacity:.4,blending:THREE.AdditiveBlending})));
 // Faint starfield for depth.
 (function(){const n=700,p=[];for(let i=0;i<n;i++){const r=13+Math.random()*20,a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);p.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.05,color:0x46618f,map:G,transparent:true,opacity:.4,depthWrite:false,blending:THREE.AdditiveBlending})))})();

 // ---- Nodes, cables and travelling pulses --------------------------------
 const anchors=[],pulses=[],netG=new THREE.Group();netG.visible=false;world.add(netG);
 function anchorHemi(side,v){const dxn=.34;const z=RZ*Math.sqrt(Math.max(.05,1-dxn*dxn-v*v))+.12;return new THREE.Vector3(side*(GAP+RX*dxn),v*RY,z)}
 function mkNode(name,ab,info,kind,p){
  const el=document.createElement('div');el.className='node '+kind;
  const role=kind==='b'?'موتور':kind==='g'?'ابزار':'I/O';
  el.innerHTML='<span class="d"></span>'+name+'<span class="r">'+role+'</span>';el.querySelector('.d').textContent=ab;
  el.addEventListener('click',function(e){e.stopPropagation();showTip(el,name,info,kind);});labels.appendChild(el);
  const hex=kind==='b'?BLUE:kind==='g'?GOLD:VIOLET,c=new THREE.Vector3(0,0,0);
  const curve=new THREE.QuadraticBezierCurve3(p.clone(),p.clone().multiplyScalar(.5).add(new THREE.Vector3(0,.1,.15)),c);
  netG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(20)),new THREE.LineBasicMaterial({color:hex,transparent:true,opacity:.16,blending:THREE.AdditiveBlending})));
  const pu=new THREE.Sprite(new THREE.SpriteMaterial({map:G,color:hex,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));pu.scale.set(.14,.14,1);netG.add(pu);
  anchors.push({el,p,kind});pulses.push({pu,curve,t:Math.random(),v:.055+Math.random()*.05});
 }
 AI.forEach(([n,a,i,v])=>mkNode(n,a,i,'b',anchorHemi(-1,v)));
 TL.forEach(([n,a,i,v])=>mkNode(n,a,i,'g',anchorHemi(1,v)));
 IO.forEach(([n,a,i],k)=>{const x=(k-(IO.length-1)/2)*0.62;mkNode(n,a,i,'io',new THREE.Vector3(x,-RY*.62,RZ*.72))});

 // Agent core — always centred at the seam, always visible (the centrepiece).
 const coreEl=document.createElement('div');coreEl.className='core';
 coreEl.innerHTML='<b>عاملِ ستایش</b><span class="lat">Setayesh · Agent</span>';
 coreEl.addEventListener('click',function(e){e.stopPropagation();showTip(coreEl,'عاملِ ستایش (Agent)','هستهٔ مرکزی: پیام را می‌گیرد، از حافظه کمک می‌گیرد، بهترین موتور را انتخاب می‌کند، ابزارِ لازم را اجرا می‌کند و فایل/جوابِ نهایی را می‌سازد. روی همهٔ موتورها سوار است.','b');});
 labels.appendChild(coreEl);

 legend.innerHTML=[['مغزِ هوش (آبی)','#39b6ff'],['مغزِ ابزارها (طلایی)','#ffab3d'],['ورودی/خروجی','#a878ff']]
  .map(([t,c])=>'<div class="row"><span class="sw" style="background:'+c+'"></span>'+t+'</div>').join('');

 function showTip(el,t,d,kind){const col=kind==='b'?'#39b6ff':kind==='g'?'#ffab3d':'#a878ff';
  tip.innerHTML='<div class="h"><span class="d" style="background:'+col+'">•</span><strong>'+t+'</strong></div><p>'+d+'</p>';
  tip.classList.add('on');const r=el.getBoundingClientRect();let x=r.left+r.width/2-140;x=Math.max(8,Math.min(innerWidth-288,x));
  let y=r.bottom+10;if(y>innerHeight-130)y=r.top-130;tip.style.left=x+'px';tip.style.top=Math.max(8,y)+'px';
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>tip.classList.remove('on'),5200)}
 canvas.addEventListener('pointerup',()=>tip.classList.remove('on'));

 // Orbit: gentle drag + wheel/pinch + key zoom; very slow auto-rotate.
 let th=0,ph=0,drag=false,lx=0,ly=0,scale=1,dist=9,pinch=0;
 canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY});
 addEventListener('pointerup',()=>{drag=false;pinch=0});
 addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-lx)*.006;ph-=(e.clientY-ly)*.006;lx=e.clientX;ly=e.clientY});
 canvas.addEventListener('wheel',e=>{e.preventDefault();scale*=e.deltaY>0?1.06:.94},{passive:false});
 canvas.addEventListener('touchmove',e=>{if(e.touches.length!==2)return;e.preventDefault();
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch)scale*=pinch/d;pinch=d},{passive:false});
 canvas.addEventListener('touchend',()=>pinch=0);
 addEventListener('keydown',e=>{
  if(e.key==='Escape'){(window.parent&&window.parent!==window&&window.parent.postMessage('setayesh-brain-close','*'))||history.back();return;}
  if(e.key==='ArrowUp'||e.key==='+'||e.key==='='){e.preventDefault();scale*=.92;}
  else if(e.key==='ArrowDown'||e.key==='-'||e.key==='_'){e.preventDefault();scale*=1.08;}});

 let initDist=9;
 function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const vf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  initDist=Math.max(RY*1.15/vf,(RX+GAP)*1.35/(vf*camera.aspect))+RZ+.7;
  if(!resize._d){dist=initDist+2.4;resize._d=true;}camera.updateProjectionMatrix()}
 addEventListener('resize',resize);

 let revealed=false;
 function setReveal(on){if(on===revealed)return;revealed=on;labels.classList.toggle('on',on);
  netG.visible=on;legend.classList.toggle('on',on);document.getElementById('hint').classList.toggle('gone',on);
  if(!on)tip.classList.remove('on')}

 const v=new THREE.Vector3(),dir=new THREE.Vector3(),clk=new THREE.Clock();
 function loop(){const dt=Math.min(clk.getDelta(),.05);
  if(!reduce&&!drag)th-=(2*Math.PI/60/60)*.12;                 // very slow
  dist=Math.max(initDist*.6,Math.min(initDist+3.4,dist*scale));scale=1;ph=Math.max(-.95,Math.min(.95,ph));
  camera.position.set(Math.sin(th)*Math.cos(ph)*dist,Math.sin(ph)*dist,Math.cos(th)*Math.cos(ph)*dist);
  camera.lookAt(0,0,0);
  setReveal(dist<initDist-0.4);                                // zoom in → names + links appear
  pulses.forEach(p=>{if(revealed&&!reduce)p.t=(p.t+p.v*dt)%1;const pt=p.curve.getPoint(p.t);p.pu.position.copy(pt);
   const edge=Math.min(p.t,1-p.t);p.pu.material.opacity=revealed?Math.max(.12,Math.min(1,edge*6))*.95:0});
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;camera.getWorldDirection(dir);
  v.set(0,0,0).project(camera);coreEl.style.transform='translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*h)+'px) translate(-50%,-50%)';
  anchors.forEach(a=>{v.copy(a.p);const face=v.clone().sub(camera.position).normalize().dot(dir);v.project(camera);
   a.el.style.transform='translate('+((v.x*.5+.5)*w)+'px,'+((-v.y*.5+.5)*h)+'px) translate(-50%,-50%)';
   const vis=revealed&&face>0.02;a.el.style.opacity=vis?1:0;a.el.style.pointerEvents=vis?'auto':'none'});
  requestAnimationFrame(loop)}
 resize();loop();
})();
</script>
</body>
</html>
